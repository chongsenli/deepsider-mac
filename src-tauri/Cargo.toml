[package]
name = "deepsider"
version = "1.3.2"
description = "DeepSider for macOS — native Tauri shell around the DeepSider web app"
authors = ["starinight"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "deepsider_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-web-kit = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
